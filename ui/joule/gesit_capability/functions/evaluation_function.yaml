action_groups:
- actions:
  - type: api-request
    method: GET
    system_alias: GESIT_API
    path: /evaluation
    result_variable: apiResponse
  - type: message
    message:
      type: text
      markdown: true
      content: <? apiResponse.body.SUMMARY ?>
  - type: message
    message:
      type: text
      markdown: true
      content: <? apiResponse.body.TABLE_MD ?>
  - type: message
    message:
      type: quickReplies
      content:
        title: What next?
        buttons:
        - title: Run scenario S1
          value: Run GESIT on scenario S1
        - title: Run all scenarios
          value: Run GESIT on all scenarios
        - title: Reset demo
          value: Reset the GESIT demo
