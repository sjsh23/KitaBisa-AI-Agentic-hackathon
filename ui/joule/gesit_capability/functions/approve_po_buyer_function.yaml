parameters:
- name: ebeln
action_groups:
- actions:
  - type: api-request
    method: POST
    system_alias: GESIT_API
    path: /approvals/<? ebeln ?>/approve
    headers:
      Content-Type: application/json
    body: '{"as": "BUYER"}

      '
    result_variable: apiResponse
  - type: message
    message:
      type: text
      markdown: true
      content: <? apiResponse.body.SUMMARY ?>
  - type: message
    message:
      type: quickReplies
      content:
        title: What next?
        buttons:
        - title: Pending approvals
          value: Show pending approvals
        - title: Integrity flags
          value: Show integrity flags
        - title: Reset demo
          value: Reset the GESIT demo
