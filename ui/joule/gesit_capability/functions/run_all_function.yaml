action_groups:
  - actions:
      - type: api-request
        method: POST
        system_alias: GESIT_API
        path: /run
        headers:
          Content-Type: application/json
        body: >
          {"scenario": "all", "llm": true}
        result_variable: apiResponse
      - type: message
        message:
          type: text
          markdown: true
          content: "<? apiResponse.body.SUMMARY ?>"
      - type: message
        message:
          type: text
          markdown: true
          content: "<? apiResponse.body.TABLE_MD ?>"
      - type: message
        message:
          type: text
          markdown: true
          content: "<? apiResponse.body.PLAN_MD ?>"
