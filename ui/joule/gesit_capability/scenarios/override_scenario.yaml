description: As the buyer, choose a different supplier than the GESIT recommendation for a scenario, with a written justification. The Integrity Guard logs it.
slots:
  - name: scenario_id
    description: The GESIT scenario, one of S1, S2 or S3.
  - name: lifnr
    description: The supplier number the buyer wants instead, for example 100108.
  - name: justification
    description: Why the buyer overrides the recommendation, at least 20 characters.
target:
  name: override_function
  type: function
